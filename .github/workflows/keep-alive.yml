name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render Backend
        run: |
          curl --retry 5 \
               --retry-delay 5 \
               --max-time 30 \
               -L https://pruthweesh-portfolio-api.onrender.com/